        purchaseDeadline:
          type: string
          format: date-time
          nullable: true
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ─── Dashboard Schemas ───────────────────

    DashboardSummary:
      type: object
      properties:
        totalQuotes:
          type: integer
        draftQuotes:
          type: integer
        pendingApprovalQuotes:
          type: integer
        approvedQuotes:
          type: integer
        confirmedQuotes:
          type: integer
        rejectedQuotes:
          type: integer
        totalRevenuePeriod:
          type: string
        avgCumulativeDiscountPct:
          type: number
        openNegotiationTickets:
          type: integer
        activeBackorders:
          type: integer

    DealAlert:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
        customerName:
          type: string
        alertType:
          type: string
          enum: [stalled, discount_anomaly, delivery_slippage]
        severity:
          type: string
          enum: [low, medium, high]
        message:
          type: string
          example: "Quote for Acme Corp has been in 'Manager Review' for 8 days"
        createdAt:
          type: string
          format: date-time

    # ─── Audit Log Schema ────────────────────

    AuditLog:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
          nullable: true
        userId:
          type: string
        userName:
          type: string
        userRole:
          type: string
        action:
          type: string
          example: "DISCOUNT_CHANGED"
        description:
          type: string
          example: "Sales Rep changed discount on Laptop Pro from 10% to 18%"
        oldValues:
          type: object
          nullable: true
        newValues:
          type: object
          nullable: true
        comment:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    # ─── Notification Schema ─────────────────

    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
            - approval_required
            - approval_decision
            - negotiation_ticket_raised
            - negotiation_decision
            - backorder_fulfilled
            - quote_sent
            - quote_confirmed
            - deposit_received
            - deposit_refunded
        message:
          type: string
        relatedQuoteId:
          type: string
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

# Apply BearerAuth globally (all endpoints require auth unless security: [] is set)
security:
  - BearerAuth: []
