          type: string
        quoteLineId:
          type: string
        ticketId:
          type: string
          nullable: true
        content:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time

    # ─── Portal Schemas ──────────────────────

    PortalQuoteSummary:
      type: object
