openapi: 3.0.3

info:
  title: DealFlow360 API
  version: 2.0.0
  description: |
    Complete REST API for **DealFlow360** — an intelligent, self-governing B2B Sales Operations Platform.

    ## Key Capabilities
    - Multi-type stacking discount governance (product + bulk + consistency + premium + variant)
    - Automatic approval routing (Sales Rep only OR Sales Rep + Manager)
    - Normal pool vs Premium/Bulk pool inventory management with refundable deposit
    - Nearest-warehouse fulfillment allocation for hardware products
    - SaaS/software license products with recurring subscription billing
    - Customer portal negotiation via formal ticket system (hold → accept/reject → deadline)
    - Deal health dashboard and region-based demand recommendations for Finance/Ops
    - Full audit trail

    ## Authentication
    - **Internal users** (admin / manager / sales_rep / finance): `POST /auth/login`
    - **Customers** (self-registered): `POST /auth/signup` then `POST /auth/portal/login`
    - Access token returned in JSON response body — client stores in memory only (NOT localStorage)
    - Refresh token set as `HttpOnly, SameSite=Strict` cookie — never in response body
    - Use `Authorization: Bearer <accessToken>` header on all protected endpoints

    ## Product Types
    - `hardware` — Physical goods. Has inventory, warehouse allocation, pool management.
    - `software` — SaaS/license. No warehouse. Generates subscriptions. No pool logic.

  contact:
    name: DealFlow360 Team

servers:
  - url: http://localhost:5000/api/v1
    description: Local Development
  - url: https://api.dealflow360.com/v1
    description: Production

tags:
  - name: Auth
    description: Login, signup, token refresh, logout
  - name: Users
    description: Internal user management (admin only), soft delete, bulk upload
  - name: Customers
    description: Customer records and tier management
  - name: Products
    description: Hardware and software products, variants, price lists
  - name: Config
    description: System configuration — discount policies, approval chains, pool config, subscription plans, upsell rules
  - name: Warehouses
    description: Warehouse management, inventory stock levels, pool breakdown
  - name: Quotations
    description: Quote lifecycle — create, submit, approve, send to customer, deposit
  - name: QuoteLines
    description: Quote line management with full 5-type discount breakdown
  - name: Approvals
    description: Approval request management (Level 1 sales_rep, Level 2 manager)
  - name: Recommendations
    description: Upsell and cross-sell product suggestions
  - name: Fulfillment
    description: Nearest-warehouse allocation and backorder management
  - name: Billing
    description: Invoices, subscriptions, proration previews, payments
  - name: Negotiation
    description: Negotiation ticket management (internal team view)
  - name: Portal
    description: Customer-facing portal — restricted view, negotiation tickets, deposit, confirmation
  - name: Dashboard
    description: Deal health, KPIs, pool health, region demand
  - name: Reports
    description: Filterable reports with PDF/XLS export
  - name: AuditLogs
    description: Full audit trail per quote and globally
  - name: Notifications
    description: In-app notification management

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ═══════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════

  /auth/signup:
    post:
      tags: [Auth]
      summary: Customer self-registration
      description: Creates a new Customer account with `free` tier. No admin involvement needed.
      operationId: authSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Arjun Mehta
                email:
                  type: string
                  format: email
                  example: arjun@company.com
                password:
                  type: string
                  minLength: 8
                  example: SecurePass@123
                phone:
                  type: string
                  example: "+919876543210"
      responses:
        '201':
          description: Customer account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          customer:
                            $ref: '#/components/schemas/CustomerPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                success: false
                message: "An account with this email already exists"
                data: null
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Internal user login
      description: |
        Login for admin / manager / sales_rep / finance users.
        Returns `accessToken` in response body.
        Sets `refreshToken` as an HttpOnly SameSite cookie.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: manager@dealflow360.com
                password:
                  type: string
                  example: MyPassword@123
      responses:
        '200':
          description: Login successful — access token in body, refresh token in cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                            description: Short-lived JWT (15 min). Store in memory only.
                          user:
                            $ref: '#/components/schemas/UserPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                success: false
                message: "Invalid email or password"
                data: null
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/portal/login:
    post:
      tags: [Auth]
      summary: Customer portal login
      description: |
        Login for customers accessing the portal.
        Returns `accessToken` in response body with `role: customer`.
        Sets `refreshToken` cookie (HttpOnly, SameSite=Strict).
      operationId: authPortalLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Portal login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          customer:
                            $ref: '#/components/schemas/CustomerPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Reads refresh token from HttpOnly cookie, returns new access token in body.
      operationId: authRefresh
      security: []
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
        '401':
          description: Refresh token missing, invalid, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                success: false
                message: "Refresh token not found or has been revoked — please log in again"
                data: null
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout — clear refresh cookie
      description: Server-side invalidation of refresh token. Clears the cookie.
      operationId: authLogout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: authMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile and role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/UserPublic'
                          - $ref: '#/components/schemas/CustomerPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me/password:
    patch:
      tags: [Auth]
      summary: Change own password
      operationId: authChangePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ═══════════════════════════════════════════
  # USERS
  # ═══════════════════════════════════════════

  /users:
    get:
      tags: [Users]
      summary: List internal users
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, manager, sales_rep, finance]
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of internal users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Users]
      summary: Create a single internal user
      description: Admin only. Creates a user with a specified role.
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/bulk:
    post:
      tags: [Users]
      summary: Bulk create internal users
      description: |
        Admin only. Accepts a JSON array of users.
        Returns 207 Multi-Status — valid rows created, failed rows returned with reason.
      operationId: bulkCreateUsers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '207':
          description: Partial success — some rows may have failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Users]
      summary: Update user (name, role, isActive)
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role:
                  type: string
                  enum: [admin, manager, sales_rep, finance]
                isActive:
                  type: boolean
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Users]
      summary: Soft-deactivate a user
      description: Sets `isActive = false` and records `deletedAt`. Data is preserved.
      operationId: softDeleteUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot deactivate own account or last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate a soft-deleted user
      operationId: reactivateUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      responses:
        '200':
          description: User reactivated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ═══════════════════════════════════════════
  # CUSTOMERS
  # ═══════════════════════════════════════════

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: listCustomers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: tier
          in: query
          schema:
            type: string
            enum: [free, premium]
        - name: name
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Customers]
      summary: Manually create a customer record
      description: Admin/manager can create customers directly (e.g., onboarding enterprise clients).
      operationId: createCustomer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /customers/{customerId}:
    get:
      tags: [Customers]
      summary: Get customer by ID
      operationId: getCustomerById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerIdParam'
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Customers]
      summary: Update customer (tier, credit limit, location)
      description: |
        Admin/manager only.
        - Upgrading tier from `free` to `premium` adds premiumDiscount eligibility on future quotes.
        - Location (lat/lng) is required for hardware order fulfillment.
      operationId: updateCustomer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tier:
                  type: string
                  enum: [free, premium]
                creditLimit:
                  type: number
                  format: decimal
                locationLat:
                  type: number
                  format: float
                  example: 12.9716
                locationLng:
                  type: number
                  format: float
                  example: 77.5946
                address:
                  type: string
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Customers]
      summary: Soft-deactivate customer
      operationId: softDeleteCustomer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerIdParam'
      responses:
        '200':
          description: Customer deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot deactivate customer with active orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /customers/{customerId}/reactivate:
    post:
      tags: [Customers]
      summary: Reactivate a deactivated customer
      operationId: reactivateCustomer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerIdParam'
      responses:
        '200':
          description: Customer reactivated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /customers/{customerId}/quotes:
    get:
      tags: [Customers]
      summary: List quotes for a customer
      operationId: getCustomerQuotes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerIdParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Customer's quotes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/QuotationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ═══════════════════════════════════════════
  # PRODUCTS
  # ═══════════════════════════════════════════

  /products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: productType
          in: query
          description: Filter by hardware or software
          schema:
            type: string
            enum: [hardware, software]
        - name: category
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedMeta'
                          - type: object
                            properties:
                              items:
