# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  # ═══════════════════════════════════════════
  # SECURITY SCHEMES
  # ═══════════════════════════════════════════

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token obtained from `/auth/login` or `/auth/refresh`.
        Include as: `Authorization: Bearer <accessToken>`
        Token lifetime: 15 minutes. Store in memory only — NOT localStorage.

  # ═══════════════════════════════════════════
  # REUSABLE PARAMETERS
  # ═══════════════════════════════════════════

  parameters:
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    userIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
    customerIdParam:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    productIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
    variantIdParam:
      name: variantId
      in: path
      required: true
      schema:
        type: string
    priceListIdParam:
      name: priceListId
      in: path
      required: true
      schema:
        type: string
    policyIdParam:
      name: policyId
      in: path
      required: true
      schema:
        type: string
    chainIdParam:
      name: chainId
      in: path
      required: true
      schema:
        type: string
    planIdParam:
      name: planId
      in: path
      required: true
      schema:
        type: string
    warehouseIdParam:
      name: warehouseId
      in: path
      required: true
      schema:
        type: string
    quoteIdParam:
      name: quoteId
      in: path
      required: true
      schema:
        type: string
    lineIdParam:
      name: lineId
      in: path
      required: true
      schema:
        type: string
    approvalIdParam:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
    ticketIdParam:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
    backorderIdParam:
      name: backorderId
      in: path
      required: true
      schema:
        type: string
    invoiceIdParam:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
    subscriptionIdParam:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string

  # ═══════════════════════════════════════════
  # REUSABLE RESPONSES
  # ═══════════════════════════════════════════

  responses:
    BadRequest:
      description: Bad Request — missing or invalid fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    Unauthorized:
      description: Unauthorized — missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            message: "Access token missing or invalid. Please login again."
            data: null

    Forbidden:
      description: Forbidden — valid user but insufficient role for this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            message: "You do not have permission to perform this action"
            data: null

    NotFound:
      description: Not Found — resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            message: "Resource not found"
            data: null

    Conflict:
      description: Conflict — state conflict or duplicate resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    UnprocessableEntity:
      description: Unprocessable Entity — valid structure but semantic violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            message: "An unexpected error occurred. Please try again later."
            data: null

  # ═══════════════════════════════════════════
  # SCHEMAS
  # ═══════════════════════════════════════════

  schemas:

    # ─── Base Response Schemas ───────────────

    ApiSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          nullable: true

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Meaningful, specific error description"
        data:
          nullable: true
          example: null

    PaginatedMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    BulkCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "14 users created, 2 failed"
        data:
          type: object
          properties:
            created:
              type: array
              items:
                $ref: '#/components/schemas/UserPublic'
            failed:
              type: array
              items:
                type: object
                properties:
                  row:
                    type: integer
                  email:
                    type: string
                  reason:
                    type: string

    # ─── Auth & User Schemas ─────────────────

    UserPublic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, manager, sales_rep, finance]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, manager, sales_rep, finance]

    # ─── Customer Schemas ────────────────────

    CustomerPublic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        tier:
          type: string
          enum: [free, premium]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerPublic'
        - type: object
          properties:
            phone:
              type: string
            address:
              type: string
            locationLat:
              type: number
              nullable: true
            locationLng:
              type: number
              nullable: true
            creditLimit:
              type: string
              example: "500000.00"
            orderCount:
              type: integer
              description: Total confirmed orders — used for consistency discount eligibility

    CreateCustomerRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
        tier:
          type: string
          enum: [free, premium]
          default: free
        creditLimit:
          type: number
        locationLat:
          type: number
        locationLng:
          type: number
        address:
          type: string

    # ─── Product Schemas ─────────────────────

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          example: Hardware
        productType:
          type: string
          enum: [hardware, software]
          description: Immutable after creation. Hardware uses inventory/warehouses. Software uses licenses/subscriptions.
        listPrice:
          type: string
          example: "75000.00"
        cost:
          type: string
          example: "50000.00"
          description: Internal field — never exposed to customer
        tax:
          type: string
          example: "18.00"
          description: Tax percentage
        productDiscountPct:
          type: number
          example: 5.0
          description: Inherent product-level discount
        weight:
          type: number
          nullable: true
          description: Hardware only — kg
        isRecurring:
          type: boolean
          description: Software only — if true, subscription plan required on quote line
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name, category, productType, listPrice]
      properties:
        name:
          type: string
        category:
          type: string
        productType:
          type: string
          enum: [hardware, software]
        listPrice:
          type: number
          format: decimal
        cost:
          type: number
          format: decimal
        tax:
          type: number
          format: decimal
        productDiscountPct:
          type: number
          format: decimal
          default: 0
        weight:
          type: number
          format: decimal
          description: Required if productType=hardware
        isRecurring:
          type: boolean
          description: Used if productType=software

    ProductVariant:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        attribute:
          type: string
          example: OS
        value:
          type: string
          example: "Windows 7"
        extraPrice:
          type: string
          example: "-5000.00"
          description: Negative for downgrade
        variantDiscountPct:
          type: number
          example: -8.0
          description: Negative = discount for choosing this spec downgrade (e.g., older OS)

    CreateVariantRequest:
      type: object
      required: [attribute, value]
      properties:
        attribute:
          type: string
        value:
          type: string
        extraPrice:
          type: number
        variantDiscountPct:
          type: number
          description: Use negative value for spec downgrade discount

    PriceList:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
          enum: [free, premium]
        currency:
          type: string
          example: INR
        rules:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              price:
                type: string

    CreatePriceListRequest:
      type: object
      required: [name, tier, currency]
      properties:
        name:
          type: string
        tier:
          type: string
          enum: [free, premium]
        currency:
          type: string
        rules:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              price:
                type: number

    # ─── Config Schemas ──────────────────────

    DiscountPolicy:
      type: object
      properties:
        id:
          type: string
        customerTier:
          type: string
          enum: [free, premium]
        productCategory:
          type: string
          example: Hardware
        maxDiscountPct:
          type: number
          example: 15.0
          description: Maximum allowed cumulative discount % for this tier + category combination

    CreateDiscountPolicyRequest:
      type: object
      required: [customerTier, productCategory, maxDiscountPct]
      properties:
        customerTier:
          type: string
          enum: [free, premium]
        productCategory:
          type: string
        maxDiscountPct:
          type: number
          minimum: 0
          maximum: 100

    DiscountTypeRule:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [bulk, consistency, premium, variant]
          description: |
            - bulk: Applied when order qty exceeds bulkThresholdQty
            - consistency: Applied when customer has purchased consistently
            - premium: Applied for premium tier customers
            - variant: Applied per-variant (configured on ProductVariant.variantDiscountPct)
        bulkThresholdQty:
          type: integer
          nullable: true
          description: For bulk type only
        bulkDiscountPct:
          type: number
          nullable: true
          description: For bulk type only
        consistencyOrderCount:
          type: integer
          nullable: true
          description: For consistency type — minimum past orders to qualify
        consistencyDiscountPct:
          type: number
          nullable: true
          description: For consistency type
        premiumDiscountPct:
          type: number
          nullable: true
          description: For premium type — additional % for premium tier customers

    CreateDiscountTypeRuleRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [bulk, consistency, premium]
        bulkThresholdQty:
          type: integer
        bulkDiscountPct:
          type: number
        consistencyOrderCount:
          type: integer
        consistencyDiscountPct:
          type: number
        premiumDiscountPct:
          type: number

    ApprovalChainRule:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
          example: "Over-ceiling by 0-5% → sales_rep only. Over 5% → sales_rep + manager."
        salesRepOnlyMaxOverCeilingPct:
          type: number
          description: |
            If blendedRiskScore ≤ this value: Level 1 only (sales_rep approves).
            If blendedRiskScore > this value: Level 2 (sales_rep + manager).
          example: 5.0
        createdAt:
          type: string
          format: date-time

    CreateApprovalChainRequest:
      type: object
      required: [salesRepOnlyMaxOverCeilingPct]
      properties:
        salesRepOnlyMaxOverCeilingPct:
          type: number
          minimum: 0
          description: |
            Threshold that divides Level 1 from Level 2.
            blendedRiskScore ≤ threshold → Level 1 (sales_rep only)
            blendedRiskScore > threshold → Level 2 (sales_rep + manager)
        description:
          type: string

    PoolConfig:
      type: object
      properties:
        normalPoolPct:
          type: number
          example: 50
          description: Percentage of total stock allocated to normal pool
        premiumBulkPoolPct:
          type: number
          example: 50
          description: Percentage of total stock allocated to premium/bulk pool
        depositPct:
          type: number
          example: 10
          description: Percentage of estimatedNetTotal required as deposit for premium/bulk orders
        holdDurationHours:
          type: integer
          example: 48
          description: How long a product is held after a negotiation ticket is raised

    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: "CloudDB Monthly"
        billingPeriod:
          type: string
          enum: [monthly, quarterly, yearly]
        prorationType:
          type: string
          enum: [daily, none]
        price:
          type: string
          example: "5000.00"
        isActive:
          type: boolean

    CreateSubscriptionPlanRequest:
      type: object
      required: [name, billingPeriod, price]
      properties:
        name:
          type: string
        billingPeriod:
          type: string
          enum: [monthly, quarterly, yearly]
        prorationType:
          type: string
          enum: [daily, none]
          default: daily
        price:
          type: number

    UpsellRule:
      type: object
      properties:
        id:
          type: string
        sourceProductId:
          type: string
        suggestedProductId:
          type: string
        reason:
          type: string
          example: "Commonly purchased together"
        minMarginPct:
          type: number
          example: 20.0
        isPromotion:
          type: boolean

    CreateUpsellRuleRequest:
      type: object
      required: [sourceProductId, suggestedProductId, reason]
      properties:
        sourceProductId:
          type: string
        suggestedProductId:
          type: string
        reason:
          type: string
        minMarginPct:
          type: number
          default: 0
        isPromotion:
          type: boolean
          default: false

    # ─── Warehouse & Inventory Schemas ───────

    Warehouse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
          example: "South India"
        locationLat:
          type: number
          example: 12.9716
        locationLng:
          type: number
          example: 77.5946
        shippingCostFactor:
          type: number
          description: Multiplier used in shipping cost estimation
          example: 1.2
        isActive:
          type: boolean

    CreateWarehouseRequest:
      type: object
      required: [name, region, locationLat, locationLng]
      properties:
        name:
          type: string
        region:
          type: string
        locationLat:
          type: number
        locationLng:
          type: number
        shippingCostFactor:
          type: number
          default: 1.0

    Inventory:
      type: object
      properties:
        warehouseId:
          type: string
        warehouseName:
          type: string
        productId:
          type: string
        productName:
          type: string
        normalPoolQty:
          type: integer
        premiumBulkPoolQty:
          type: integer
        reservedNormal:
          type: integer
        reservedPremium:
          type: integer
        availableNormal:
          type: integer
          description: normalPoolQty - reservedNormal
        availablePremiumBulk:
          type: integer
          description: premiumBulkPoolQty - reservedPremium

    RegionDemandRecord:
      type: object
      properties:
        region:
          type: string
        productId:
          type: string
        productName:
          type: string
        demandCount:
          type: integer
          description: Number of order lines for this product in this region during the period
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date

    # ─── Quotation Schemas ───────────────────

    QuoteStatus:
      type: string
      enum:
        - draft
        - sales_rep_review
        - manager_review
        - returned
        - approved
        - sent_to_customer
        - under_negotiation
        - confirmed
        - fulfilling
        - partially_fulfilled
        - fulfilled
        - billed
        - paid
        - cancelled
        - rejected

    QuotationSummary:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        salesRepId:
          type: string
        salesRepName:
          type: string
        status:
          $ref: '#/components/schemas/QuoteStatus'
        currency:
          type: string
        netTotal:
          type: string
        blendedRiskScore:
          type: number
        validUntil:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Quotation:
      allOf:
        - $ref: '#/components/schemas/QuotationSummary'
        - type: object
          properties:
            subtotal:
              type: string
            taxTotal:
              type: string
            discountTotal:
              type: string
            marginPct:
              type: number
              description: Internal — never exposed to customer
            estimatedNetTotal:
              type: string
              nullable: true
              description: Total with all discounts (shown before approval is complete)
            confirmedNetTotal:
              type: string
              nullable: true
              description: Final total post-approval
            approvalLevel:
              type: integer
              nullable: true
              enum: [1, 2]
            hasHardwareLines:
              type: boolean
            hasSoftwareLines:
              type: boolean
            lines:
              type: array
              items:
                $ref: '#/components/schemas/QuoteLine'
            notes:
              type: string

    QuotationTotals:
      type: object
      properties:
        subtotal:
          type: string
        discountTotal:
          type: string
        taxTotal:
          type: string
        netTotal:
          type: string
        marginPct:
          type: number
        blendedRiskScore:
          type: number

    DiscountBreakdown:
      type: object
      description: Full 5-type discount calculation for a single quote line
      properties:
        lineId:
          type: string
        productId:
          type: string
        productName:
          type: string
        unitPrice:
          type: string
        quantity:
          type: integer
        productDiscountPct:
          type: number
          example: 5.0
        bulkDiscountPct:
          type: number
          example: 3.0
          description: 0 if quantity below bulk threshold
        consistencyDiscountPct:
          type: number
          example: 2.0
          description: 0 if customer hasn't met consistency order count
        premiumDiscountPct:
          type: number
          example: 5.0
          description: 0 if customer is free tier
        variantDiscountPct:
          type: number
          example: -8.0
          description: 0 if no variant or variant has no discount; negative for downgrade
        cumulativeDiscountPct:
          type: number
          example: 7.0
          description: Sum of all applicable discount types
        ceilingPct:
          type: number
          example: 15.0
          description: DiscountPolicy.maxDiscountPct for this tier + category
        isOverLimit:
          type: boolean
        overLimitPct:
          type: number
          example: 0
          description: cumulativeDiscountPct - ceilingPct (0 if within limit)
        poolAssignment:
          type: string
          enum: [normal, premium_bulk]

    QuoteLine:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productType:
          type: string
          enum: [hardware, software]
        variantId:
          type: string
          nullable: true
        variantLabel:
          type: string
          nullable: true
          example: "OS: Windows 7"
        quantity:
          type: integer
        unitPrice:
          type: string
        discountBreakdown:
          $ref: '#/components/schemas/DiscountBreakdown'
        lineTotal:
          type: string
        marginPct:
          type: number
          description: Internal — never exposed to customer
        isRecurring:
          type: boolean
        subscriptionPlanId:
          type: string
          nullable: true
        poolAssignment:
          type: string
          enum: [normal, premium_bulk]

    CreateQuoteLineRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        variantId:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          nullable: true
          description: If not provided, uses price list or product list price
        subscriptionPlanId:
          type: string
          nullable: true
          description: Required if product is software and isRecurring=true

    QuoteLineAddedResult:
      type: object
      properties:
        newLine:
          $ref: '#/components/schemas/QuoteLine'
        quoteTotals:
          $ref: '#/components/schemas/QuotationTotals'
        approvalsInvalidated:
          type: boolean
          description: True if quote was previously approved and approvals were reset

    RiskEvaluation:
      type: object
      properties:
        quoteId:
          type: string
        blendedRiskScore:
          type: number
          description: Sum of overLimitPct for all over-limit lines
        approvalLevelRequired:
          type: integer
          nullable: true
          enum: [null, 1, 2]
          description: null = no approval needed; 1 = sales_rep only; 2 = sales_rep + manager
        overLimitLines:
          type: array
          items:
            type: object
            properties:
              lineId:
                type: string
              productName:
                type: string
              cumulativeDiscountPct:
                type: number
              ceilingPct:
                type: number
              overLimitPct:
                type: number
              poolAssignment:
                type: string
        calculatedAt:
          type: string
          format: date-time

    # ─── Deposit Schema ──────────────────────

    DepositRecord:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
        customerId:
          type: string
        amount:
          type: string
        depositPct:
          type: number
        status:
          type: string
          enum: [pending, paid, refunded, deducted_from_invoice]
        method:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        refundedAt:
          type: string
          format: date-time
          nullable: true

    # ─── Approval Schemas ────────────────────

    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
        level:
          type: integer
          enum: [1, 2]
          description: 1=sales_rep review; 2=manager review
        approverId:
          type: string
          nullable: true
        approverName:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected, returned]
        comments:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ─── Recommendation Schemas ──────────────

    Recommendation:
      type: object
      properties:
        productId:
          type: string
        productName:
          type: string
        productType:
          type: string
          enum: [hardware, software]
        listPrice:
          type: string
        reason:
          type: string
          example: "Commonly purchased with Laptop Pro"
        marginDeltaPct:
          type: number
          description: Expected margin improvement if added
        isPromotion:
          type: boolean
        rank:
          type: integer

    # ─── Fulfillment Schemas ─────────────────

    AllocationRecord:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
        status:
          type: string
          enum: [proposed, accepted, overridden]
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationItem'
        hasBackorders:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AllocationItem:
      type: object
      properties:
        id:
          type: string
        warehouseId:
          type: string
        warehouseName:
          type: string
        distanceKm:
          type: number
          description: Distance from warehouse to customer location
        productId:
          type: string
        productName:
          type: string
        quantityAllocated:
          type: integer
        poolType:
          type: string
          enum: [normal, premium_bulk]
        estimatedShipCost:
          type: string

    BackorderRecord:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
        productId:
          type: string
        productName:
          type: string
        warehouseId:
          type: string
          nullable: true
        quantityUnfulfilled:
          type: integer
        status:
          type: string
          enum: [created, stock_arrived, fulfilled, cancelled]
        expectedDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ─── Billing Schemas ─────────────────────

    BillingSchedule:
      type: object
      properties:
        quoteId:
          type: string
        oneTimeTotal:
          type: string
        recurringTotal:
          type: string
        nextBillingDate:
          type: string
          format: date
          nullable: true
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'

    BillingGeneratedResult:
      type: object
      properties:
        oneTimeInvoice:
          $ref: '#/components/schemas/Invoice'
          nullable: true
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionInstance'
        billingSchedule:
          $ref: '#/components/schemas/BillingSchedule'

    Invoice:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
        customerId:
          type: string
        type:
          type: string
          enum: [one_time, recurring]
        amount:
          type: string
        depositDeducted:
          type: string
          nullable: true
          description: Deposit amount deducted from this invoice (if applicable)
        amountDue:
          type: string
          description: amount - depositDeducted
        status:
          type: string
          enum: [draft, sent, paid, overdue, closed]
        dueDate:
          type: string
          format: date
        issuedAt:
          type: string
          format: date-time
          nullable: true

    SubscriptionInstance:
      type: object
      properties:
        id:
          type: string
        quoteLineId:
          type: string
        customerId:
          type: string
        planId:
          type: string
        planName:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [active, modified, cancelled]
        nextBillingDate:
          type: string
          format: date
        startDate:
          type: string
          format: date
        billingPeriod:
          type: string
          enum: [monthly, quarterly, yearly]

    ProrationPreview:
      type: object
      properties:
        subscriptionId:
          type: string
        currentQuantity:
          type: integer
        newQuantity:
          type: integer
        currentPlanId:
          type: string
          nullable: true
        newPlanId:
          type: string
          nullable: true
        daysRemainingInCycle:
          type: integer
        dailyRate:
          type: string
        proratedAmount:
          type: string
          description: Positive = additional charge; negative = credit note
        type:
          type: string
          enum: [charge, credit]

    Payment:
      type: object
      properties:
        id:
          type: string
        invoiceId:
          type: string
        amount:
          type: string
        method:
          type: string
        reference:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time
        recordedByUserId:
          type: string

    # ─── Negotiation Schemas ─────────────────

    NegotiationTicket:
      type: object
      properties:
        id:
          type: string
        quoteId:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        requestedDiscountPct:
          type: number
        counterDiscountPct:
          type: number
          nullable: true
        comments:
