      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/QuoteStatus'
        statusLabel:
          type: string
          example: "Under Negotiation"
        currency:
          type: string
        estimatedNetTotal:
          type: string
          nullable: true
          description: Shown when approval is pending
        confirmedNetTotal:
          type: string
          nullable: true
          description: Shown after approval
        validUntil:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        depositRequired:
          type: boolean
