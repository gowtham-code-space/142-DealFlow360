        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Warehouses]
      summary: Adjust stock delta for a product
      operationId: adjustWarehouseInventory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/warehouseIdParam'
        - $ref: '#/components/parameters/productIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pool, delta]
              properties:
                pool:
                  type: string
                  enum: [normal, premium_bulk]
                delta:
                  type: integer
                  description: Positive to add, negative to subtract
      responses:
        '200':
          description: Stock adjusted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Inventory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /inventory:
    get:
      tags: [Warehouses]
      summary: Global inventory view (all warehouses × products)
      operationId: getGlobalInventory
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: query
          schema:
            type: string
        - name: warehouseId
          in: query
          schema:
            type: string
        - name: belowThreshold
          in: query
