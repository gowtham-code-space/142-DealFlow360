      description: Returns quotes grouped by status stage for pipeline visualization.
      operationId: getPipeline
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pipeline data grouped by stage
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            stage:
                              type: string
                            count:
                              type: integer
