            type: string
        - name: periodDays
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Region demand records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RegionDemandRecord'
        '401':
