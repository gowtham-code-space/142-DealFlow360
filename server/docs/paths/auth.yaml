# ═══════════════════════════════════════════
# AUTH
# ═══════════════════════════════════════════

/auth/signup:
  post:
    tags: [Auth]
    summary: Customer self-registration
    description: Creates a new Customer account with `free` tier. No admin involvement needed.
    operationId: authSignup
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, password]
            properties:
              name:
                type: string
                example: Arjun Mehta
              email:
                type: string
                format: email
                example: arjun@company.com
              password:
                type: string
                minLength: 8
                example: SecurePass@123
              phone:
                type: string
                example: "+919876543210"
    responses:
      '201':
        description: Customer account created
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        accessToken:
                          type: string
                        customer:
                          $ref: '#/components/schemas/CustomerPublic'
      '400':
        $ref: '#/components/responses/BadRequest'
      '409':
        description: Email already registered
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiErrorResponse'
            example:
              success: false
              message: "An account with this email already exists"
              data: null
      '500':
        $ref: '#/components/responses/InternalError'

/auth/login:
  post:
    tags: [Auth]
    summary: Internal user login
    description: |
      Login for admin / manager / sales_rep / finance users.
      Returns `accessToken` in response body.
      Sets `refreshToken` as an HttpOnly SameSite cookie.
    operationId: authLogin
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
                example: manager@dealflow360.com
              password:
                type: string
                example: MyPassword@123
    responses:
      '200':
        description: Login successful — access token in body, refresh token in cookie
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        accessToken:
                          type: string
                          description: Short-lived JWT (15 min). Store in memory only.
                        user:
                          $ref: '#/components/schemas/UserPublic'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiErrorResponse'
            example:
              success: false
              message: "Invalid email or password"
              data: null
      '500':
        $ref: '#/components/responses/InternalError'

/auth/portal/login:
  post:
    tags: [Auth]
    summary: Customer portal login
    description: |
      Login for customers accessing the portal.
      Returns `accessToken` in response body with `role: customer`.
      Sets `refreshToken` cookie (HttpOnly, SameSite=Strict).
    operationId: authPortalLogin
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
    responses:
      '200':
        description: Portal login successful
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        accessToken:
                          type: string
                        customer:
                          $ref: '#/components/schemas/CustomerPublic'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/InternalError'

/auth/refresh:
  post:
    tags: [Auth]
    summary: Refresh access token
    description: Reads refresh token from HttpOnly cookie, returns new access token in body.
    operationId: authRefresh
    security: []
    responses:
      '200':
        description: New access token issued
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        accessToken:
                          type: string
      '401':
        description: Refresh token missing, invalid, or revoked
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiErrorResponse'
            example:
              success: false
              message: "Refresh token not found or has been revoked — please log in again"
              data: null
      '500':
        $ref: '#/components/responses/InternalError'

/auth/logout:
  post:
    tags: [Auth]
    summary: Logout — clear refresh cookie
    description: Server-side invalidation of refresh token. Clears the cookie.
    operationId: authLogout
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Logged out successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/InternalError'

/auth/me:
  get:
    tags: [Auth]
    summary: Get current user profile
    operationId: authMe
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Current user profile and role
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      oneOf:
                        - $ref: '#/components/schemas/UserPublic'
                        - $ref: '#/components/schemas/CustomerPublic'
      '401':
        $ref: '#/components/responses/Unauthorized'

/auth/me/password:
  patch:
    tags: [Auth]
    summary: Change own password
    operationId: authChangePassword
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [currentPassword, newPassword]
            properties:
              currentPassword:
                type: string
              newPassword:
                type: string
                minLength: 8
    responses:
      '200':
        description: Password changed successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessResponse'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/InternalError'
