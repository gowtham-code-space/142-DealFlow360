# ═══════════════════════════════════════════
# USERS
# ═══════════════════════════════════════════

/api/v1/users:
  get:
    tags: [Users]
    summary: List internal users
    operationId: listUsers
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: role
        in: query
        schema:
          type: string
          enum: [admin, manager, sales_rep, finance]
      - name: isActive
        in: query
        schema:
          type: boolean
    responses:
      '200':
        description: List of internal users
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      allOf:
                        - $ref: '#/components/schemas/PaginatedMeta'
                        - type: object
                          properties:
                            items:
                              type: array
                              items:
                                $ref: '#/components/schemas/UserPublic'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '500':
        $ref: '#/components/responses/InternalError'

  post:
    tags: [Users]
    summary: Create a single internal user
    description: Admin only. Creates a user with a specified role.
    operationId: createUser
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserRequest'
    responses:
      '201':
        description: User created
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UserPublic'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '409':
        description: Email already exists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiErrorResponse'
      '500':
        $ref: '#/components/responses/InternalError'

/api/v1/users/bulk:
  post:
    tags: [Users]
    summary: Bulk create internal users
    description: |
      Admin only. Accepts a JSON array of users.
      Returns 207 Multi-Status — valid rows created, failed rows returned with reason.
    operationId: bulkCreateUsers
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [users]
            properties:
              users:
                type: array
                items:
                  $ref: '#/components/schemas/CreateUserRequest'
    responses:
      '207':
        description: Partial success — some rows may have failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateResponse'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'
      '500':
        $ref: '#/components/responses/InternalError'

/api/v1/users/{userId}:
  get:
    tags: [Users]
    summary: Get user by ID
    operationId: getUserById
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/userIdParam'
    responses:
      '200':
        description: User detail
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UserPublic'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

  patch:
    tags: [Users]
    summary: Update user (name, role, isActive)
    operationId: updateUser
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/userIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              role:
                type: string
                enum: [admin, manager, sales_rep, finance]
              isActive:
                type: boolean
    responses:
      '200':
        description: User updated
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UserPublic'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

  delete:
    tags: [Users]
    summary: Soft-deactivate a user
    description: Sets `isActive = false` and records `deletedAt`. Data is preserved.
    operationId: softDeleteUser
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/userIdParam'
    responses:
      '200':
        description: User deactivated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        description: Cannot deactivate own account or last admin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiErrorResponse'
      '500':
        $ref: '#/components/responses/InternalError'

/api/v1/users/{userId}/reactivate:
  post:
    tags: [Users]
    summary: Reactivate a soft-deleted user
    operationId: reactivateUser
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/userIdParam'
    responses:
      '200':
        description: User reactivated
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UserPublic'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'
