# ═══════════════════════════════════════════
# AUDIT LOGS
# ═══════════════════════════════════════════

/quotes/{quoteId}/audit-logs:
  get:
    tags: [AuditLogs]
    summary: Get audit trail for a quote
    operationId: getQuoteAuditLogs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/quoteIdParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
    responses:
      '200':
        description: Quote audit trail
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      allOf:
                        - $ref: '#/components/schemas/PaginatedMeta'
                        - type: object
                          properties:
                            items:
                              type: array
                              items:
                                $ref: '#/components/schemas/AuditLog'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

/audit-logs:
  get:
    tags: [AuditLogs]
    summary: Global audit log (admin only)
    operationId: getGlobalAuditLogs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: userId
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Global audit log
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      allOf:
                        - $ref: '#/components/schemas/PaginatedMeta'
                        - type: object
                          properties:
                            items:
                              type: array
                              items:
                                $ref: '#/components/schemas/AuditLog'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '500':
        $ref: '#/components/responses/InternalError'
