# ═══════════════════════════════════════════
# RECOMMENDATIONS
# ═══════════════════════════════════════════

/api/v1/quotes/{quoteId}/recommendations:
  get:
    tags: [Recommendations]
    summary: Get upsell / cross-sell suggestions
    description: Ranked by co-purchase history, active promotions, and minimum margin filter.
    operationId: getRecommendations
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/quoteIdParam'
    responses:
      '200':
        description: Ranked recommendations
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Recommendation'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

/api/v1/quotes/{quoteId}/recommendations/{productId}/add:
  post:
    tags: [Recommendations]
    summary: Accept a recommendation — add product as new quote line
    operationId: addRecommendedProduct
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/quoteIdParam'
      - $ref: '#/components/parameters/productIdParam'
    responses:
      '201':
        description: Product added as new line. Returns updated quote totals.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/QuoteLineAddedResult'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        description: Quote is not in an editable status
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiErrorResponse'
      '500':
        $ref: '#/components/responses/InternalError'

/api/v1/quotes/{quoteId}/recommendations/{productId}/dismiss:
  post:
    tags: [Recommendations]
    summary: Dismiss a recommendation
    operationId: dismissRecommendation
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/quoteIdParam'
      - $ref: '#/components/parameters/productIdParam'
    responses:
      '200':
        description: Recommendation dismissed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'
