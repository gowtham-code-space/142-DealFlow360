/price-lists/{priceListId}:
  get:
    tags: [Products]
    summary: Get price list by ID
    operationId: getPriceListById
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/priceListIdParam'
    responses:
      '200':
        description: Price list detail
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PriceList'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

  patch:
    tags: [Products]
    summary: Update price list
    operationId: updatePriceList
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/priceListIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              currency:
                type: string
              rules:
                type: array
                items:
                  type: object
                  properties:
                    productId:
                      type: string
                    price:
                      type: number
    responses:
      '200':
        description: Price list updated
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PriceList'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

  delete:
    tags: [Products]
    summary: Delete price list
    operationId: deletePriceList
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/priceListIdParam'
    responses:
      '200':
        description: Price list deleted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'
