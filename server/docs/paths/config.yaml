    operationId: updateSubscriptionPlan
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/planIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              billingPeriod:
                type: string
                enum: [monthly, quarterly, yearly]
              prorationType:
                type: string
                enum: [daily, none]
              price:
                type: number
    responses:
      '200':
        description: Plan updated
        content:
          application/json:
