/config/discount-policies:
  get:
    tags: [Config]
    summary: List discount ceiling policies
    operationId: listDiscountPolicies
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Discount policies
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/DiscountPolicy'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '500':
        $ref: '#/components/responses/InternalError'

  post:
    tags: [Config]
    summary: Create a discount ceiling policy
    description: Define max discount % for a given customer tier + product category combination.
    operationId: createDiscountPolicy
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateDiscountPolicyRequest'
    responses:
      '201':
        description: Policy created
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DiscountPolicy'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '409':
        description: Policy already exists for this tier+category
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiErrorResponse'
      '500':
        $ref: '#/components/responses/InternalError'

/config/discount-policies/{policyId}:
  get:
    tags: [Config]
    summary: Get discount policy by ID
    operationId: getDiscountPolicyById
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/policyIdParam'
    responses:
      '200':
        description: Policy detail
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DiscountPolicy'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

  patch:
    tags: [Config]
    summary: Update discount ceiling
    operationId: updateDiscountPolicy
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/policyIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              maxDiscountPct:
                type: number
                format: decimal
                minimum: 0
                maximum: 100
    responses:
      '200':
        description: Policy updated
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DiscountPolicy'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

  delete:
    tags: [Config]
    summary: Delete discount policy
    operationId: deleteDiscountPolicy
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/policyIdParam'
    responses:
      '200':
        description: Policy deleted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalError'

